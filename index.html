<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#070707"><title>My Music — Spine v0.3</title>
<style>
:root{--bg:#070707;--line:#242424;--muted:#898989;--white:#f5f5f5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overscroll-behavior:none}header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(7,7,7,.94);backdrop-filter:blur(14px)}.logo{font-weight:800;font-size:16px;letter-spacing:.23em}.status{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:13px}.clock{font-variant-numeric:tabular-nums}.topline{height:42px;flex:0 0 42px;display:flex;justify-content:space-between;align-items:end;padding:0 28px 10px}.collection{font-size:11px;letter-spacing:.22em;color:#777;text-transform:uppercase}.counter{font-size:11px;color:#555}#viewport{position:relative;flex:0 0 176px;height:176px;overflow:hidden;touch-action:none}#viewport:before,#viewport:after{content:"";position:absolute;z-index:5;top:0;width:45px;height:100%;pointer-events:none}#viewport:before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}#viewport:after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}#track{position:absolute;left:0;top:0;height:170px;display:flex;gap:7px;padding:0 34px;align-items:flex-end;will-change:transform}.spine{width:68px;height:158px;flex:0 0 68px;border-radius:3px 3px 1px 1px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.38);transform-origin:bottom center;transition:transform .22s,border-color .22s,filter .22s;background:#242424;background-size:cover;background-position:center}.spine:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent 18%,transparent 80%,rgba(0,0,0,.4)),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.68))}.spine.selected{transform:translateY(-8px) scale(1.045);border-color:rgba(255,255,255,.8);filter:brightness(1.12)}.vtitle{position:absolute;z-index:2;top:10px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;white-space:nowrap;max-height:118px;overflow:hidden;text-shadow:0 1px 4px #000;font-size:10px;font-weight:800;letter-spacing:.055em}.vyear{position:absolute;z-index:2;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;text-shadow:0 1px 4px #000;color:#ddd}main{flex:1;min-height:0;display:grid;place-items:center;padding:18px 28px}.hero{width:min(860px,92vw);display:grid;grid-template-columns:minmax(250px,410px) minmax(230px,1fr);gap:42px;align-items:center}.artwrap{position:relative}.cover{width:100%;aspect-ratio:1;border:1px solid #2c2c2c;background:linear-gradient(135deg,#282828,#0c0c0c);background-size:cover;background-position:center;box-shadow:0 26px 80px rgba(0,0,0,.67);position:relative;overflow:hidden}.cover.loading:after{content:"LOADING ARTWORK";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.18em;color:#666}.cover.fallback:after{content:attr(data-fallback);position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;font-size:28px;font-weight:900;letter-spacing:.08em;background:linear-gradient(145deg,#343434,#0b0b0b)}.glow{position:absolute;inset:15%;z-index:-1;filter:blur(55px);opacity:.32;background:var(--glow,#777);transition:background .35s}.info{align-self:center}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#888;margin-bottom:12px}h1{font-size:clamp(30px,4.3vw,54px);line-height:.98;letter-spacing:-.025em;margin:0 0 14px}.year{font-size:14px;color:#777;margin-bottom:28px}.actions{display:flex;gap:12px;align-items:center}.play{border:0;background:#f2f2f2;color:#080808;border-radius:999px;height:48px;padding:0 23px;font-size:14px;font-weight:750;display:flex;align-items:center;gap:10px}.play span{font-size:16px}.ghost{height:48px;padding:0 18px;border:1px solid #3a3a3a;color:#aaa;background:#111;border-radius:999px;font-size:13px}.note{margin-top:22px;font-size:12px;line-height:1.5;color:#555;max-width:350px}footer{height:64px;flex:0 0 64px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#090909}.now{display:flex;gap:10px;align-items:center;font-size:12px;color:#666}.dot{width:6px;height:6px;border-radius:50%;background:#555}.now strong{color:#bbb}.controls{display:flex;gap:9px}.round{width:38px;height:38px;border-radius:50%;border:1px solid #363636;background:#111;color:#ddd;display:grid;place-items:center;font-size:16px}@media(max-height:700px){#viewport{height:145px;flex-basis:145px}.spine{height:132px}.hero{grid-template-columns:minmax(220px,330px) 1fr;gap:30px}footer{height:54px;flex-basis:54px}}@media(max-width:750px){header,.topline,footer{padding-left:16px;padding-right:16px}.hero{width:94vw;gap:20px;grid-template-columns:45vw 1fr}h1{font-size:27px}.actions{flex-wrap:wrap}.ghost{display:none}.note{font-size:11px}.spine{width:62px;flex-basis:62px}}
</style></head><body>
<header><div class="logo">MY MUSIC</div><div class="status"><span>SPINE DEMO</span><span class="clock" id="clock"></span></div></header><div class="topline"><div class="collection" id="artistLabel">COURTEENERS</div><div class="counter" id="counter">1 / 11</div></div><div id="viewport"><div id="track"></div></div><main><section class="hero"><div class="artwrap"><div class="glow" id="glow"></div><div class="cover loading" id="cover"></div></div><div class="info"><div class="eyebrow" id="artist">Courteeners</div><h1 id="album">St. Jude</h1><div class="year" id="year">2008</div><div class="actions"><button class="play" id="play"><span>▶</span> Open in Spotify</button><button class="ghost" id="random">Surprise me</button></div><div class="note">Swipe the album spines. Tap an album to select it. Artwork loads live from Wikipedia for this prototype; Spotify library integration comes next.</div></div></section></main><footer><div class="now"><span class="dot"></span><span>DEMO MODE · <strong id="footerTitle">St. Jude</strong></span></div><div class="controls"><button class="round" id="prev">‹</button><button class="round" id="next">›</button></div></footer>
<script>
const albums=[{artist:"Courteeners",title:"St. Jude",year:2008,wiki:"St. Jude (album)",spotify:"https://open.spotify.com/search/St.%20Jude%20Courteeners"},{artist:"Courteeners",title:"Falcon",year:2010,wiki:"Falcon (album)",spotify:"https://open.spotify.com/search/Falcon%20Courteeners"},{artist:"Courteeners",title:"Anna",year:2013,wiki:"Anna (Courteeners album)",spotify:"https://open.spotify.com/search/Anna%20Courteeners"},{artist:"Courteeners",title:"Concrete Love",year:2014,wiki:"Concrete Love",spotify:"https://open.spotify.com/search/Concrete%20Love%20Courteeners"},{artist:"Courteeners",title:"Mapping the Rendezvous",year:2016,wiki:"Mapping the Rendezvous",spotify:"https://open.spotify.com/search/Mapping%20the%20Rendezvous%20Courteeners"},{artist:"Courteeners",title:"St. Jude Re:Wired",year:2018,wiki:"St. Jude (album)",spotify:"https://open.spotify.com/search/St.%20Jude%20Rewired%20Courteeners"},{artist:"Courteeners",title:"More. Again. Forever.",year:2020,wiki:"More. Again. Forever.",spotify:"https://open.spotify.com/search/More%20Again%20Forever%20Courteeners"},{artist:"Courteeners",title:"Pink Cactus Café",year:2024,wiki:"Pink Cactus Café",spotify:"https://open.spotify.com/search/Pink%20Cactus%20Cafe%20Courteeners"},{artist:"Sam Fender",title:"Hypersonic Missiles",year:2019,wiki:"Hypersonic Missiles (album)",spotify:"https://open.spotify.com/search/Hypersonic%20Missiles%20Sam%20Fender"},{artist:"Sam Fender",title:"Seventeen Going Under",year:2021,wiki:"Seventeen Going Under",spotify:"https://open.spotify.com/search/Seventeen%20Going%20Under%20Sam%20Fender"},{artist:"Sam Fender",title:"People Watching",year:2025,wiki:"People Watching (album)",spotify:"https://open.spotify.com/search/People%20Watching%20Sam%20Fender"}];
const vp=document.getElementById("viewport"),track=document.getElementById("track"),cover=document.getElementById("cover"),artistEl=document.getElementById("artist"),albumEl=document.getElementById("album"),yearEl=document.getElementById("year"),label=document.getElementById("artistLabel"),counter=document.getElementById("counter"),footerTitle=document.getElementById("footerTitle"),glow=document.getElementById("glow");const artCache={};let index=0,x=34,dragging=false,moved=false,startX=0,startOffset=0,velocity=0,lastX=0,lastT=0,step=75;
function calcStep(){const s=track.querySelector(".spine");if(s)step=s.getBoundingClientRect().width+7}function contentWidth(){return 34+albums.length*(step-7)+(albums.length-1)*7+34}function minX(){return Math.min(34,vp.clientWidth-contentWidth())}function clamp(v){return Math.max(minX(),Math.min(34,v))}function targetX(i){return clamp(34-i*step)}
function build(){albums.forEach((a,i)=>{const s=document.createElement("div");s.className="spine";s.dataset.i=i;s.innerHTML='<div class="vtitle">'+a.title+'</div><div class="vyear">'+a.year+'</div>';track.appendChild(s)});calcStep()}
async function loadArtwork(i){const a=albums[i];if(artCache[a.wiki])return artCache[a.wiki];try{const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles="+encodeURIComponent(a.wiki);const r=await fetch(url),j=await r.json(),pages=j.query&&j.query.pages?Object.values(j.query.pages):[],src=pages[0]&&pages[0].thumbnail?pages[0].thumbnail.source:"";artCache[a.wiki]=src;return src}catch(e){return ""}}
async function updateInfo(){const selected=index,a=albums[selected];artistEl.textContent=a.artist;albumEl.textContent=a.title;yearEl.textContent=a.year;label.textContent=a.artist.toUpperCase();counter.textContent=(selected+1)+" / "+albums.length;footerTitle.textContent=a.title;document.querySelectorAll(".spine").forEach((s,i)=>s.classList.toggle("selected",i===selected));cover.className="cover loading";cover.style.backgroundImage="";cover.dataset.fallback=a.title.toUpperCase();const src=await loadArtwork(selected);if(selected!==index)return;if(src){cover.style.backgroundImage='url("'+src+'")';cover.className="cover";glow.style.setProperty("--glow",a.artist==="Sam Fender"?"#4f748b":"#8e443f");const sp=document.querySelector('.spine[data-i="'+selected+'"]');if(sp)sp.style.backgroundImage='url("'+src+'")'}else{cover.className="cover fallback";glow.style.setProperty("--glow","#555")}[selected-2,selected-1,selected+1,selected+2].filter(i=>i>=0&&i<albums.length).forEach(async i=>{const u=await loadArtwork(i);if(u){const s=document.querySelector('.spine[data-i="'+i+'"]');if(s)s.style.backgroundImage='url("'+u+'")'}})}
function render(animated=true){track.style.transition=animated?"transform .32s cubic-bezier(.18,.8,.2,1)":"none";track.style.transform="translate3d("+x+"px,0,0)";updateInfo()}function select(i,animated=true){index=Math.max(0,Math.min(albums.length-1,i));x=targetX(index);render(animated)}function snapWithMomentum(){const projected=x+velocity*150;index=Math.max(0,Math.min(albums.length-1,Math.round((34-projected)/step)));x=targetX(index);render(true)}function begin(px){dragging=true;moved=false;startX=px;startOffset=x;lastX=px;lastT=performance.now();velocity=0;track.style.transition="none"}function move(px){if(!dragging)return;const now=performance.now(),dt=Math.max(1,now-lastT),dx=px-lastX;velocity=dx/dt;const total=px-startX;if(Math.abs(total)>6)moved=true;let nx=startOffset+total;if(nx>34)nx=34+(nx-34)*.22;if(nx<minX())nx=minX()+(nx-minX())*.22;x=nx;track.style.transform="translate3d("+x+"px,0,0)";lastX=px;lastT=now}function end(){if(!dragging)return;dragging=false;snapWithMomentum()}
vp.addEventListener("touchstart",e=>{if(e.touches.length===1)begin(e.touches[0].clientX)},{passive:true});vp.addEventListener("touchmove",e=>{if(e.touches.length===1)move(e.touches[0].clientX)},{passive:true});vp.addEventListener("touchend",end,{passive:true});vp.addEventListener("touchcancel",end,{passive:true});vp.addEventListener("mousedown",e=>begin(e.clientX));window.addEventListener("mousemove",e=>move(e.clientX));window.addEventListener("mouseup",end);track.addEventListener("click",e=>{const s=e.target.closest(".spine");if(!s||moved)return;select(Number(s.dataset.i),true)});document.getElementById("prev").onclick=()=>select(index-1,true);document.getElementById("next").onclick=()=>select(index+1,true);document.getElementById("random").onclick=()=>{let n=index;while(n===index)n=Math.floor(Math.random()*albums.length);select(n,true)};document.getElementById("play").onclick=()=>window.location.href=albums[index].spotify;function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}window.addEventListener("resize",()=>{calcStep();x=targetX(index);render(false)});build();tick();setInterval(tick,1000);select(0,false);
</script></body></html>
