<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070707">
<title>My Music — Spotify Spine v0.7</title>
<style>
:root{--bg:#070707;--line:#242424;--muted:#888;--spotify:#1ed760}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overscroll-behavior:none} button,select{font:inherit}
header{height:62px;flex:0 0 62px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:16px;font-weight:800;letter-spacing:.22em}.status{display:flex;gap:14px;align-items:center;color:#888;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#555}.connected .dot{background:var(--spotify)}
.topline{height:40px;flex:0 0 40px;padding:0 26px 9px;display:flex;align-items:end;justify-content:space-between}.collection{font-size:11px;letter-spacing:.2em;color:#777}.counter{font-size:11px;color:#555}
#viewport{height:172px;flex:0 0 172px;overflow:hidden;position:relative;touch-action:none}
#track{position:absolute;height:166px;display:flex;align-items:flex-end;gap:7px;padding:0 34px;will-change:transform}
.spine{width:68px;height:154px;flex:0 0 68px;position:relative;overflow:hidden;border-radius:3px;border:1px solid rgba(255,255,255,.13);background:#222 center/cover;box-shadow:0 7px 20px rgba(0,0,0,.42);transform-origin:bottom;transition:.2s transform,.2s border-color,.2s filter}
.spine:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent 20%,transparent 80%,rgba(0,0,0,.45)),linear-gradient(180deg,transparent,rgba(0,0,0,.72))}
.spine.selected{transform:translateY(-7px) scale(1.045);border-color:#eee;filter:brightness(1.12)}.vtitle{position:absolute;z-index:2;top:9px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;white-space:nowrap;max-height:116px;overflow:hidden;font-size:10px;font-weight:800;text-shadow:0 1px 4px #000}.vyear{position:absolute;z-index:2;bottom:7px;left:50%;transform:translateX(-50%);font-size:9px;text-shadow:0 1px 4px #000}
main{flex:1;min-height:0;display:grid;place-items:center;padding:15px 26px}
.hero{width:min(930px,94vw);display:grid;grid-template-columns:minmax(250px,390px) minmax(285px,1fr);gap:38px;align-items:center}
.artwrap{position:relative}.cover{width:100%;aspect-ratio:1;background:#111 center/cover;border:1px solid #2b2b2b;box-shadow:0 24px 75px rgba(0,0,0,.68)}.glow{position:absolute;inset:15%;z-index:-1;filter:blur(55px);opacity:.28;background:#777}
.eyebrow{font-size:11px;letter-spacing:.2em;color:#888;text-transform:uppercase;margin-bottom:10px}h1{font-size:clamp(28px,4vw,50px);line-height:.98;letter-spacing:-.025em;margin:0 0 11px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.year{font-size:13px;color:#777;margin-bottom:17px}
.playrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary,.secondary{height:46px;border-radius:999px;padding:0 20px;font-size:13px}.primary{border:0;background:var(--spotify);color:#03190a;font-weight:800}.secondary{border:1px solid #3c3c3c;background:#111;color:#ddd}
.destination{margin-top:14px;display:flex;align-items:center;gap:8px;color:#777;font-size:12px}.destination strong{color:#bbb}.change{border:0;background:none;color:#999;text-decoration:underline;padding:0}
.nowcard{margin-top:17px;border-top:1px solid #282828;padding-top:14px}.nowlabel{font-size:10px;letter-spacing:.18em;color:#666;margin-bottom:8px}.trackline{display:flex;gap:12px;align-items:center}.thumb{width:48px;height:48px;border-radius:3px;background:#181818 center/cover}.tracktext{min-width:0;flex:1}.trackname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trackartist{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.transport{display:flex;gap:8px;align-items:center;margin-top:11px}.circle{width:38px;height:38px;border-radius:50%;border:1px solid #3a3a3a;background:#111;color:#eee;display:grid;place-items:center;font-size:15px}.circle.big{width:44px;height:44px;background:#eee;color:#080808;border:0}
.progress{flex:1;height:4px;background:#242424;border-radius:4px;overflow:hidden;margin-left:6px}.progress>div{height:100%;width:0;background:#bdbdbd}.time{font-size:10px;color:#666;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.speakerPanel{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}.speakerBox{width:min(520px,90vw);background:#111;border:1px solid #333;border-radius:18px;padding:22px}.speakerTitle{font-size:20px;font-weight:750;margin-bottom:15px}.speakerRow{display:flex;gap:10px}.speakerRow select{flex:1;min-width:0;height:44px;border:1px solid #444;border-radius:10px;background:#191919;color:#eee;padding:0 12px}.speakerRow button{height:44px;border-radius:10px;border:1px solid #444;background:#1b1b1b;color:#eee;padding:0 14px}.speakerMsg{font-size:12px;color:#777;margin-top:11px;line-height:1.45}.speakerMsg.ok{color:#8fe6aa}.speakerMsg.error{color:#ff9f9f}.closeSpeaker{margin-top:15px;width:100%;height:44px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:700}
#login{text-align:center;max-width:520px}#login h1{font-size:40px;-webkit-line-clamp:unset}.loginCopy{color:#888;line-height:1.55;margin:0 auto 25px}.connect{height:48px;border:0;border-radius:999px;padding:0 23px;background:var(--spotify);color:#04190b;font-weight:800}.loginNote{font-size:12px;color:#777;margin-top:15px}.error{color:#ff9f9f!important}
footer{height:54px;flex:0 0 54px;border-top:1px solid var(--line);padding:0 26px;display:flex;align-items:center;justify-content:space-between;color:#666;font-size:11px}.hidden{display:none!important}
@media(max-height:700px){#viewport{height:140px;flex-basis:140px}.spine{height:128px}.hero{grid-template-columns:minmax(210px,315px) 1fr;gap:28px}.nowcard{margin-top:10px;padding-top:10px}.year{margin-bottom:10px}footer{height:46px;flex-basis:46px}}
@media(max-width:760px){header,.topline,footer{padding-left:15px;padding-right:15px}.hero{width:95vw;grid-template-columns:43vw 1fr;gap:18px}.spine{width:61px;flex-basis:61px}h1{font-size:25px}.secondary.hideSmall{display:none}}
</style>
</head>
<body>
<header><div class="logo">MY MUSIC</div><div class="status"><span id="spotifyState" class="connected"><span class="dot"></span> SPOTIFY</span><span id="clock"></span></div></header>

<div id="libraryUI" class="hidden">
  <div class="topline"><div class="collection">SPOTIFY LIBRARY</div><div class="counter" id="counter"></div></div>
  <div id="viewport"><div id="track"></div></div>
</div>

<main>
<section id="login">
  <h1>Your music wall.</h1>
  <div class="loginCopy">Connect Spotify to load your saved albums and control playback on your Spotify Connect speaker.</div>
  <button class="connect" id="connectBtn">Connect Spotify</button>
  <div class="loginNote" id="loginNote"></div>
</section>

<section id="hero" class="hero hidden">
  <div class="artwrap"><div class="glow"></div><div id="cover" class="cover"></div></div>
  <div>
    <div class="eyebrow" id="artist"></div><h1 id="album"></h1><div class="year" id="year"></div>
    <div class="playrow">
      <button class="primary" id="playAlbum">▶ Play album</button>
      <button class="secondary hideSmall" id="random">Surprise me</button>
    </div>
    <div class="destination">Playing on: <strong id="deviceName">Choose speaker</strong> <button class="change" id="changeSpeaker">change</button></div>

    <div class="nowcard">
      <div class="nowlabel">NOW PLAYING</div>
      <div class="trackline"><div id="nowArt" class="thumb"></div><div class="tracktext"><div id="nowTrack" class="trackname">Nothing playing</div><div id="nowArtist" class="trackartist">—</div></div></div>
      <div class="transport">
        <button class="circle" id="previousTrack">‹</button>
        <button class="circle big" id="togglePlay">▶</button>
        <button class="circle" id="nextTrack">›</button>
        <div class="progress"><div id="progressBar"></div></div><div class="time" id="timeText">0:00</div>
      </div>
    </div>
  </div>
</section>
</main>

<footer id="footer" class="hidden"><span id="footerTitle"></span><span id="libraryCount"></span></footer>

<div id="speakerPanel" class="speakerPanel hidden">
  <div class="speakerBox">
    <div class="speakerTitle">Choose speaker</div>
    <div class="speakerRow"><select id="deviceSelect"><option>Loading…</option></select><button id="refreshDevices">Refresh</button></div>
    <div class="speakerMsg" id="speakerMsg">Looking for Spotify Connect devices…</div>
    <button class="closeSpeaker" id="closeSpeaker">Use this speaker</button>
  </div>
</div>

<script>
const CLIENT_ID="df124d32c7434a7b942bdc31d6f73b83";
const REDIRECT_URI="https://thesedge-dak.github.io/spine-music/";
const SCOPES="user-library-read user-read-playback-state user-modify-playback-state";
const SCOPE_VERSION="v07-playback";
const AUTH="https://accounts.spotify.com/authorize",TOKEN="https://accounts.spotify.com/api/token",API="https://api.spotify.com/v1";
let albums=[],devices=[],index=0,x=34,drag=false,moved=false,startX=0,startOffset=0,velocity=0,lastX=0,lastT=0,step=75,isPlaying=false,playbackTimer=null;

const $=id=>document.getElementById(id),track=$("track"),vp=$("viewport");
function b64url(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function randomVerifier(len=64){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",a=new Uint8Array(len);crypto.getRandomValues(a);return Array.from(a,b=>chars[b%chars.length]).join("")}
async function challenge(v){return b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))}
async function connect(){
 const verifier=randomVerifier(),state=randomVerifier(32);sessionStorage.setItem("pkce",verifier);sessionStorage.setItem("state",state);
 const p=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,scope:SCOPES,code_challenge_method:"S256",code_challenge:await challenge(verifier),state,show_dialog:"true"});location.href=AUTH+"?"+p;
}
function saveTokens(t){if(t.access_token)localStorage.setItem("sat",t.access_token);if(t.refresh_token)localStorage.setItem("srt",t.refresh_token);if(t.expires_in)localStorage.setItem("sexp",Date.now()+t.expires_in*1000-60000)}
function clearTokens(){["sat","srt","sexp","scopev"].forEach(k=>localStorage.removeItem(k))}
async function exchange(code){
 const body=new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:sessionStorage.getItem("pkce")||""});
 const r=await fetch(TOKEN,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok)throw Error("Spotify login failed ("+r.status+")");saveTokens(await r.json());localStorage.setItem("scopev",SCOPE_VERSION)
}
async function refresh(){const rt=localStorage.getItem("srt");if(!rt)return null;const body=new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:rt});const r=await fetch(TOKEN,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok){clearTokens();return null}const t=await r.json();saveTokens(t);return t.access_token}
async function getToken(){const t=localStorage.getItem("sat"),e=+localStorage.getItem("sexp");return t&&Date.now()<e?t:await refresh()}
async function api(url,opt={}){
 let token=await getToken();if(!token)throw Error("Spotify connection expired.");let headers={...(opt.headers||{}),Authorization:"Bearer "+token};if(opt.body)headers["Content-Type"]="application/json";
 let r=await fetch(url,{...opt,headers});if(r.status===401){token=await refresh();headers.Authorization="Bearer "+token;r=await fetch(url,{...opt,headers})}
 if(!r.ok){let d="";try{d=(await r.json())?.error?.message||""}catch{}throw Error("Spotify "+r.status+(d?": "+d:""))}if(r.status===204)return null;return r.json()
}
async function loadAlbums(){
 let out=[],url=API+"/me/albums?limit=50";while(url){const d=await api(url);for(const it of d.items||[]){const a=it.album;if(a)out.push({id:a.id,title:a.name,artist:(a.artists||[]).map(v=>v.name).join(", "),year:(a.release_date||"").slice(0,4),image:a.images?.[0]?.url||"",uri:a.uri,url:a.external_urls?.spotify||""})}url=d.next}
 const seen=new Set();albums=out.filter(a=>!seen.has(a.id)&&seen.add(a.id))
}
async function loadDevices(){
 $("speakerMsg").className="speakerMsg";$("speakerMsg").textContent="Looking for Spotify Connect devices…";
 try{const d=await api(API+"/me/player/devices");devices=(d.devices||[]).filter(v=>v.id);$("deviceSelect").innerHTML="";
 if(!devices.length){$("deviceSelect").innerHTML="<option>No devices found</option>";$("speakerMsg").className="speakerMsg error";$("speakerMsg").textContent="No devices found. Start Spotify on the Echo, then refresh.";return}
 devices.sort((a,b)=>(b.is_active?1:0)-(a.is_active?1:0)||a.name.localeCompare(b.name));const saved=localStorage.getItem("speakerId");
 devices.forEach(v=>{const o=document.createElement("option");o.value=v.id;o.textContent=v.name+" · "+v.type+(v.is_active?" · active":"");$("deviceSelect").appendChild(o)});
 const chosen=devices.find(v=>v.id===saved)||devices.find(v=>v.is_active)||devices[0];$("deviceSelect").value=chosen.id;saveSpeaker();$("speakerMsg").className="speakerMsg ok";$("speakerMsg").textContent="Selected: "+chosen.name}
 catch(e){$("speakerMsg").className="speakerMsg error";$("speakerMsg").textContent=e.message}
}
function saveSpeaker(){const id=$("deviceSelect").value;if(id){localStorage.setItem("speakerId",id);const d=devices.find(v=>v.id===id);$("deviceName").textContent=d?d.name:"Selected speaker"}}
function selectedDevice(){return devices.find(v=>v.id===$("deviceSelect").value)||devices.find(v=>v.id===localStorage.getItem("speakerId"))}
async function transferToSelected(play=false){const d=selectedDevice();if(!d)throw Error("Choose a speaker first.");await api(API+"/me/player",{method:"PUT",body:JSON.stringify({device_ids:[d.id],play})})}
async function playAlbum(){const d=selectedDevice();if(!d){openSpeaker();return}const a=albums[index];try{await api(API+"/me/player/play?device_id="+encodeURIComponent(d.id),{method:"PUT",body:JSON.stringify({context_uri:a.uri})});setTimeout(updatePlayback,800)}catch(e){alert(e.message)}}
async function togglePlay(){try{const d=selectedDevice();if(d&&!d.is_active)await transferToSelected(false);if(isPlaying)await api(API+"/me/player/pause",{method:"PUT"});else await api(API+"/me/player/play",{method:"PUT"});setTimeout(updatePlayback,450)}catch(e){alert(e.message)}}
async function skip(dir){try{await api(API+"/me/player/"+(dir==="next"?"next":"previous"),{method:"POST"});setTimeout(updatePlayback,450)}catch(e){alert(e.message)}}
function fmt(ms){const s=Math.max(0,Math.floor((ms||0)/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
async function updatePlayback(){
 try{const p=await api(API+"/me/player");if(!p||!p.item){isPlaying=false;$("togglePlay").textContent="▶";$("nowTrack").textContent="Nothing playing";$("nowArtist").textContent="—";$("nowArt").style.backgroundImage="";return}
 isPlaying=!!p.is_playing;$("togglePlay").textContent=isPlaying?"❚❚":"▶";$("nowTrack").textContent=p.item.name||"Unknown";$("nowArtist").textContent=(p.item.artists||[]).map(a=>a.name).join(", ");const art=p.item.album?.images?.[1]?.url||p.item.album?.images?.[0]?.url||"";$("nowArt").style.backgroundImage=art?'url("'+art+'")':"";
 const dur=p.item.duration_ms||1,prog=p.progress_ms||0;$("progressBar").style.width=Math.min(100,prog/dur*100)+"%";$("timeText").textContent=fmt(prog);if(p.device?.name){$("deviceName").textContent=p.device.name;const match=devices.find(d=>d.name===p.device.name);if(match){$("deviceSelect").value=match.id;localStorage.setItem("speakerId",match.id)}}}catch(e){console.log(e)}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function buildShelf(){track.innerHTML="";albums.forEach((a,i)=>{const s=document.createElement("div");s.className="spine";s.dataset.i=i;if(a.image)s.style.backgroundImage='url("'+a.image+'")';s.innerHTML='<div class="vtitle">'+esc(a.title)+'</div><div class="vyear">'+esc(a.year)+'</div>';track.appendChild(s)});calcStep();$("libraryCount").textContent=albums.length+" saved albums"}
function calcStep(){const s=track.querySelector(".spine");if(s)step=s.getBoundingClientRect().width+7}
function contentWidth(){return 34+albums.length*(step-7)+Math.max(0,albums.length-1)*7+34}function minX(){return Math.min(34,vp.clientWidth-contentWidth())}function clamp(v){return Math.max(minX(),Math.min(34,v))}function targetX(i){return clamp(34-i*step)}
function updateAlbum(){if(!albums.length)return;const a=albums[index];$("artist").textContent=a.artist;$("album").textContent=a.title;$("year").textContent=a.year;$("cover").style.backgroundImage=a.image?'url("'+a.image+'")':"";$("counter").textContent=(index+1)+" / "+albums.length;$("footerTitle").textContent=a.title;document.querySelectorAll(".spine").forEach((s,i)=>s.classList.toggle("selected",i===index))}
function render(anim=true){track.style.transition=anim?"transform .32s cubic-bezier(.18,.8,.2,1)":"none";track.style.transform="translate3d("+x+"px,0,0)";updateAlbum()}function select(i,anim=true){index=Math.max(0,Math.min(albums.length-1,i));x=targetX(index);render(anim)}
function begin(px){drag=true;moved=false;startX=px;startOffset=x;lastX=px;lastT=performance.now();velocity=0;track.style.transition="none"}function move(px){if(!drag)return;const now=performance.now(),dt=Math.max(1,now-lastT),dx=px-lastX;velocity=dx/dt;const total=px-startX;if(Math.abs(total)>6)moved=true;let nx=startOffset+total;if(nx>34)nx=34+(nx-34)*.22;if(nx<minX())nx=minX()+(nx-minX())*.22;x=nx;track.style.transform="translate3d("+x+"px,0,0)";lastX=px;lastT=now}function end(){if(!drag)return;drag=false;const p=x+velocity*150;index=Math.max(0,Math.min(albums.length-1,Math.round((34-p)/step)));x=targetX(index);render(true)}
vp.addEventListener("touchstart",e=>{if(e.touches.length===1)begin(e.touches[0].clientX)},{passive:true});vp.addEventListener("touchmove",e=>{if(e.touches.length===1)move(e.touches[0].clientX)},{passive:true});vp.addEventListener("touchend",end,{passive:true});vp.addEventListener("mousedown",e=>begin(e.clientX));window.addEventListener("mousemove",e=>move(e.clientX));window.addEventListener("mouseup",end);track.addEventListener("click",e=>{const s=e.target.closest(".spine");if(s&&!moved)select(+s.dataset.i,true)});
function openSpeaker(){$("speakerPanel").classList.remove("hidden");loadDevices()}function closeSpeaker(){saveSpeaker();$("speakerPanel").classList.add("hidden")}
$("connectBtn").onclick=connect;$("playAlbum").onclick=playAlbum;$("togglePlay").onclick=togglePlay;$("nextTrack").onclick=()=>skip("next");$("previousTrack").onclick=()=>skip("previous");$("changeSpeaker").onclick=openSpeaker;$("refreshDevices").onclick=loadDevices;$("closeSpeaker").onclick=closeSpeaker;$("deviceSelect").onchange=saveSpeaker;$("random").onclick=()=>{if(albums.length>1){let n=index;while(n===index)n=Math.floor(Math.random()*albums.length);select(n,true)}};
function showLogin(msg="",err=false){$("login").classList.remove("hidden");$("hero").classList.add("hidden");$("libraryUI").classList.add("hidden");$("footer").classList.add("hidden");$("spotifyState").classList.remove("connected");if(msg){$("loginNote").textContent=msg;$("loginNote").classList.toggle("error",err)}}
function showApp(){$("login").classList.add("hidden");$("hero").classList.remove("hidden");$("libraryUI").classList.remove("hidden");$("footer").classList.remove("hidden");$("spotifyState").classList.add("connected")}
async function init(){
 try{const q=new URLSearchParams(location.search);if(q.get("error"))throw Error("Spotify authorization was cancelled.");if(q.get("code")){if(q.get("state")!==sessionStorage.getItem("state"))throw Error("Spotify security check failed.");await exchange(q.get("code"));history.replaceState({},document.title,REDIRECT_URI)}
 if(localStorage.getItem("scopev")!==SCOPE_VERSION){clearTokens();showLogin("v0.7 needs a one-time Spotify reconnect for playback controls.",false);return}
 if(!await getToken()){showLogin();return}showApp();await Promise.all([loadAlbums(),loadDevices()]);buildShelf();select(0,false);await updatePlayback();playbackTimer=setInterval(updatePlayback,5000)}
 catch(e){console.error(e);showLogin(e.message||"Something went wrong.",true)}
}
function tick(){$("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}tick();setInterval(tick,1000);window.addEventListener("resize",()=>{if(albums.length){calcStep();x=targetX(index);render(false)}});init();
</script>
</body>
</html>
